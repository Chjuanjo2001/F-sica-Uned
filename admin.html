<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración · Física UNED</title>
<meta name="theme-color" content="#0a1210">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .admin-hero{ padding:36px 0 6px; }
  .admin-hero h1{ font-size:clamp(1.9rem,5.5vw,2.8rem); line-height:1; }
  .admin-hero h1 em{ font-style:normal; color:var(--accent); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:22px; }
  .kpi{ background:var(--bg-elev); border:1px solid var(--line); border-radius:11px; padding:15px 17px; }
  .kpi .k{ font-family:'JetBrains Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); display:block; }
  .kpi .v{ font-family:'Big Shoulders Display',sans-serif; font-size:1.9rem; font-weight:800; line-height:1.1; margin-top:4px; }
  .kpi .n{ font-size:0.72rem; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; }
  .tabs-admin{ display:flex; gap:8px; margin-top:26px; flex-wrap:wrap; }
  .tabs-admin button{
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;
    border:1px solid var(--line); background:var(--bg-elev); color:var(--ink-dim); border-radius:20px;
    padding:8px 15px; cursor:pointer;
  }
  .tabs-admin button[aria-selected="true"]{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  select.rol{ padding:5px 8px; font-size:0.75rem; }
</style>
<!-- Diagnóstico de arranque: avisa en pantalla si faltan archivos en el servidor -->
<script>
(function () {
  var fallos = [];
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      var url = t.src || t.href || '';
      if (url && url.indexOf('fonts.googleapis') === -1 && fallos.indexOf(url) === -1) fallos.push(url);
    }
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.__appLista) return;
      var lista = fallos.length
        ? '<ul style="margin:8px 0 0 18px;padding:0">' + fallos.map(function (f) {
            return '<li style="margin:3px 0;font-family:ui-monospace,monospace;font-size:13px">' +
                   f.replace(location.origin, '') + '</li>';
          }).join('') + '</ul>'
        : '';
      var aviso = document.createElement('div');
      aviso.setAttribute('role', 'alert');
      aviso.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#2c1414;' +
        'color:#ffe4e4;border-top:2px solid #ff8686;padding:16px 20px;max-height:60vh;overflow:auto;' +
        'font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      aviso.innerHTML = '<b>La aplicación no ha arrancado.</b> Faltan archivos en el servidor' +
        (fallos.length ? ':' : '. Comprueba que las carpetas <b>assets/</b>, <b>temas/</b> e <b>icons/</b> ' +
         'estén subidas junto a los .html.') + lista +
        '<div style="margin-top:10px;opacity:.85">Sube la carpeta completa (con sus subcarpetas) y recarga.</div>';
      document.body.appendChild(aviso);
    }, 8000);
  });
})();
</script>
</head>
<body>

<main class="wrap">
  <section class="admin-hero">
    <span class="eyebrow">Zona reservada</span>
    <h1>Panel de <em>administración</em></h1>
    <p class="muted" id="subtitulo" style="max-width:60ch; margin-top:12px"></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <div class="tabs-admin" role="tablist">
    <button role="tab" data-vista="usuarios" aria-selected="true">Usuarios</button>
    <button role="tab" data-vista="examenes" aria-selected="false">Exámenes</button>
    <button role="tab" data-vista="preguntas" aria-selected="false">Preguntas difíciles</button>
    <button role="tab" data-vista="contenido" aria-selected="false">Contenido</button>
  </div>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><h2 id="tituloVista">Usuarios</h2><span class="pill" id="contadorVista"></span></div>
    <div class="panel-body" style="padding:0" id="vista"></div>
  </section>
</main>

<script type="module">
import * as store from "./assets/js/store.js";
import * as ui from "./assets/js/ui.js";
import { CURSOS, TEMARIOS } from "./assets/js/curriculum.js";

await ui.arrancar("admin");

const vista = document.getElementById("vista");
const contador = document.getElementById("contadorVista");
const titulo = document.getElementById("tituloVista");

/* --- control de acceso --- */
if (!store.esAdmin()){
  document.querySelector("main").innerHTML = "";
  document.querySelector("main").appendChild(
    ui.el("div",{class:"card", style:"margin-top:60px; text-align:center"},
      ui.el("h2",{},"Acceso restringido"),
      ui.el("p",{class:"muted", style:"margin-top:10px"},"Esta zona es solo para administradores."),
      ui.el("a",{class:"btn primary", href:"index.html"},"Volver al inicio")
    )
  );
} else {
  document.getElementById("subtitulo").textContent = store.modo()==="local"
    ? "Estás en modo local: aquí verás solo tus propios datos. Cuando conectes Supabase, este panel mostrará a todos los usuarios registrados, sus resultados y las preguntas que más se atascan."
    : "Gestión de usuarios registrados, resultados de exámenes y salud del contenido.";
  pintarKPIs();
  cambiarVista("usuarios");
}

document.querySelectorAll(".tabs-admin button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tabs-admin button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true");
    cambiarVista(b.dataset.vista);
  });
});

async function pintarKPIs(){
  const kpis = document.getElementById("kpis");
  kpis.innerHTML = "";
  let usuarios = [];
  try { usuarios = await store.adminUsuarios(); } catch(e){}
  const exs = await store.adminExamenes();
  const hace7 = Date.now() - 7*86400000;
  const activos = usuarios.filter(u=>u.last_seen_at && new Date(u.last_seen_at).getTime() > hace7).length;
  const publicados = Object.values(TEMARIOS).reduce((a,s)=>a+s.temas.filter(t=>t.estado==="publicado").length,0);
  const totalTemas = Object.values(TEMARIOS).reduce((a,s)=>a+s.temas.length,0);
  const abiertas = CURSOS.flatMap(c=>c.asignaturas).filter(a=>a.estado==="abierta").length;
  const totalAsig = CURSOS.flatMap(c=>c.asignaturas).length;

  [
    { k:"Usuarios", v:usuarios.length, n:`${activos} activos esta semana` },
    { k:"Exámenes hechos", v:exs.length, n:`${exs.filter(e=>e.passed).length} aprobados` },
    { k:"Temas publicados", v:`${publicados}/${totalTemas}`, n:"en Cálculo I" },
    { k:"Asignaturas abiertas", v:`${abiertas}/${totalAsig}`, n:"del grado completo" },
  ].forEach(d=>{
    kpis.appendChild(ui.el("div",{class:"kpi"},
      ui.el("span",{class:"k"}, d.k),
      ui.el("div",{class:"v"}, String(d.v)),
      ui.el("span",{class:"n"}, d.n)
    ));
  });
}

async function cambiarVista(nombre){
  vista.innerHTML = '<div class="empty">Cargando…</div>';
  if (nombre==="usuarios") return vistaUsuarios();
  if (nombre==="examenes") return vistaExamenes();
  if (nombre==="preguntas") return vistaPreguntas();
  if (nombre==="contenido") return vistaContenido();
}

async function vistaUsuarios(){
  titulo.textContent = "Usuarios";
  const usuarios = await store.adminUsuarios();
  contador.textContent = `${usuarios.length} registrados`;
  if(!usuarios.length){ vista.innerHTML = '<div class="empty">Todavía no hay usuarios registrados.</div>'; return; }

  const tabla = ui.el("table",{},
    ui.el("thead",{}, ui.el("tr",{},
      ui.el("th",{},"Usuario"), ui.el("th",{},"Correo"), ui.el("th",{},"Rol"),
      ui.el("th",{},"XP"), ui.el("th",{},"Aciertos"), ui.el("th",{},"Alta"), ui.el("th",{},"Última actividad")
    ))
  );
  const tbody = ui.el("tbody");
  usuarios.forEach(u=>{
    const selector = ui.el("select",{class:"rol"});
    ["student","admin"].forEach(r=>{
      const o = ui.el("option",{value:r}, r==="admin"?"Administrador":"Estudiante");
      if((u.role||"student")===r) o.setAttribute("selected","selected");
      selector.appendChild(o);
    });
    selector.addEventListener("change", async ()=>{
      try{ await store.adminCambiarRol(u.id, selector.value); }
      catch(e){ alert("No se pudo cambiar el rol: "+e.message); }
    });
    if (store.modo()==="local") selector.disabled = true;

    tbody.appendChild(ui.el("tr",{},
      ui.el("td",{}, u.display_name || "—"),
      ui.el("td",{class:"num"}, u.email || "—"),
      ui.el("td",{}, selector),
      ui.el("td",{class:"num"}, String(u.xp ?? 0)),
      ui.el("td",{class:"num"}, `${u.correctas ?? 0}/${u.respuestas ?? 0}`),
      ui.el("td",{class:"num"}, ui.fecha(u.created_at)),
      ui.el("td",{class:"num"}, ui.haceCuanto(u.last_seen_at))
    ));
  });
  tabla.appendChild(tbody);
  vista.innerHTML = "";
  vista.appendChild(ui.el("div",{class:"table-scroll"}, tabla));
}

async function vistaExamenes(){
  titulo.textContent = "Exámenes";
  const exs = await store.adminExamenes();
  contador.textContent = `${exs.length} intentos`;
  if(!exs.length){ vista.innerHTML = '<div class="empty">Todavía no se ha hecho ningún examen.</div>'; return; }

  const tabla = ui.el("table",{},
    ui.el("thead",{}, ui.el("tr",{},
      ui.el("th",{},"Fecha"), ui.el("th",{},"Usuario"), ui.el("th",{},"Tema"),
      ui.el("th",{},"Nota"), ui.el("th",{},"Resultado")
    ))
  );
  const tbody = ui.el("tbody");
  exs.forEach(e=>{
    const tema = Object.values(TEMARIOS).flatMap(a=>a.temas).find(t=>t.code===e.topic);
    tbody.appendChild(ui.el("tr",{},
      ui.el("td",{class:"num"}, ui.fecha(e.at, true)),
      ui.el("td",{}, e.nombre || e.email || "—"),
      ui.el("td",{}, tema?.titulo || e.topic),
      ui.el("td",{class:"num"}, `${e.score}/${e.total}`),
      ui.el("td",{}, ui.el("span",{class:"pill "+(e.passed?"on":"warn")}, e.passed?"Aprobado":"Suspenso"))
    ));
  });
  tabla.appendChild(tbody);
  vista.innerHTML = "";
  vista.appendChild(ui.el("div",{class:"table-scroll"}, tabla));
}

async function vistaPreguntas(){
  titulo.textContent = "Preguntas difíciles";
  const dificiles = await store.adminPreguntasDificiles();
  contador.textContent = `${dificiles.length} con fallos`;
  if(!dificiles.length){ vista.innerHTML = '<div class="empty">Ninguna pregunta acumula fallos todavía.</div>'; return; }

  const tabla = ui.el("table",{},
    ui.el("thead",{}, ui.el("tr",{},
      ui.el("th",{},"Pregunta"), ui.el("th",{},"Fallos"), ui.el("th",{},"Intentos"), ui.el("th",{},"Tasa de fallo")
    ))
  );
  const tbody = ui.el("tbody");
  dificiles.forEach(d=>{
    const tasa = Math.round(100*d.fallos/Math.max(1,d.intentos));
    tbody.appendChild(ui.el("tr",{},
      ui.el("td",{class:"num"}, d.item),
      ui.el("td",{class:"num"}, String(d.fallos)),
      ui.el("td",{class:"num"}, String(d.intentos)),
      ui.el("td",{}, ui.el("span",{class:"pill "+(tasa>60?"off":"warn")}, tasa+"%"))
    ));
  });
  tabla.appendChild(tbody);
  vista.innerHTML = "";
  vista.appendChild(ui.el("div",{class:"table-scroll"}, tabla));
  vista.appendChild(ui.el("div",{class:"empty", style:"text-align:left"},
    "Las preguntas con tasa de fallo alta son candidatas a reescribirse o a reforzarse con más explicación en el tema."));
}

function vistaContenido(){
  titulo.textContent = "Contenido";
  const asignaturas = CURSOS.flatMap(c=>c.asignaturas.map(a=>({...a, curso:c.n})));
  contador.textContent = `${asignaturas.length} asignaturas`;
  const tabla = ui.el("table",{},
    ui.el("thead",{}, ui.el("tr",{},
      ui.el("th",{},"Curso"), ui.el("th",{},"Asignatura"), ui.el("th",{},"Estado"), ui.el("th",{},"Temas publicados")
    ))
  );
  const tbody = ui.el("tbody");
  asignaturas.forEach(a=>{
    const temario = TEMARIOS[a.code];
    const pub = temario ? temario.temas.filter(t=>t.estado==="publicado").length : 0;
    const tot = temario ? temario.temas.length : 0;
    tbody.appendChild(ui.el("tr",{},
      ui.el("td",{class:"num"}, String(a.curso)),
      ui.el("td",{}, a.nombre),
      ui.el("td",{}, ui.el("span",{class:"pill "+(a.estado==="abierta"?"on":"")}, a.estado==="abierta"?"Abierta":"En construcción")),
      ui.el("td",{class:"num"}, tot ? `${pub}/${tot}` : "—")
    ));
  });
  tabla.appendChild(tbody);
  vista.innerHTML = "";
  vista.appendChild(ui.el("div",{class:"table-scroll"}, tabla));
}

ui.montarPie();
</script>
</body>
</html>
