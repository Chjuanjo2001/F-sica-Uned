<html lang="es">

<style>
/* ==========================================================================
   Física UNED — sistema de diseño compartido
   Estética: panel de instrumentación / osciloscopio de laboratorio
   ========================================================================== */

:root{
  --bg:#eef2f0;
  --bg-elev:#ffffff;
  --bg-sunken:#e2eae6;
  --ink:#16241f;
  --ink-dim:#4b6058;
  --accent:#0e8a72;
  --accent-soft:#d9efe9;
  --accent-2:#b5720a;
  --accent-2-soft:#f5e6cc;
  --line:#c9d6d1;
  --grid:#dbe5e1;
  --bad:#b1352b;
  --bad-soft:#f6dcda;
  --good:#0e8a72;
  --shadow:0 8px 24px rgba(20,40,35,0.10);
  --scope-bg:#0a1210;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1210;
    --bg-elev:#101c19;
    --bg-sunken:#0d1815;
    --ink:#e7f3ee;
    --ink-dim:#93a8a0;
    --accent:#3ddc97;
    --accent-soft:#123227;
    --accent-2:#ffb454;
    --accent-2-soft:#2b2213;
    --line:#1f2f2a;
    --grid:#16211d;
    --bad:#ff8686;
    --bad-soft:#2c1414;
    --good:#3ddc97;
    --shadow:0 8px 28px rgba(0,0,0,0.45);
    --scope-bg:#050b09;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1210;
  --bg-elev:#101c19;
  --bg-sunken:#0d1815;
  --ink:#e7f3ee;
  --ink-dim:#93a8a0;
  --accent:#3ddc97;
  --accent-soft:#123227;
  --accent-2:#ffb454;
  --accent-2-soft:#2b2213;
  --line:#1f2f2a;
  --grid:#16211d;
  --bad:#ff8686;
  --bad-soft:#2c1414;
  --good:#3ddc97;
  --shadow:0 8px 28px rgba(0,0,0,0.45);
  --scope-bg:#050b09;
}

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Literata', Georgia, 'Times New Roman', serif;
  line-height:1.6;
  min-height:100vh;
  overscroll-behavior-y:none;
}
img{ max-width:100%; }
[hidden]{ display:none !important; }
::selection{ background:var(--accent); color:var(--bg-elev); }

h1,h2,h3,.display{
  font-family:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  text-transform:uppercase;
  letter-spacing:0.02em;
  text-wrap:balance;
  font-weight:800;
  margin:0;
}
p{ margin:0 0 14px; }
a{ color:var(--accent); }
.mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
code, .formula{
  font-family:'JetBrains Mono', ui-monospace, monospace;
  background:var(--bg-sunken);
  border:1px solid var(--line);
  border-radius:4px;
  padding:0.05em 0.4em;
  font-size:0.92em;
  font-variant-numeric:tabular-nums;
}
.eyebrow{
  font-family:'JetBrains Mono', monospace;
  text-transform:uppercase;
  letter-spacing:0.14em;
  font-size:0.72rem;
  color:var(--accent);
  font-weight:700;
}
.muted{ color:var(--ink-dim); }
.center{ text-align:center; }

/* ===== Contenedores ===== */
.wrap{ max-width:1000px; margin:0 auto; padding:0 20px 100px; }
.wrap.narrow{ max-width:880px; }
.wrap.tight{ max-width:520px; }
section + section{ margin-top:38px; }

/* ===== Barra superior compartida ===== */
.appbar{
  position:sticky; top:0; z-index:60;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.appbar-inner{
  max-width:1000px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:16px;
}
.brand{
  font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:1.1rem;
  letter-spacing:0.02em; white-space:nowrap; text-decoration:none; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.brand .spark{ color:var(--accent); }
.appbar nav{ display:flex; gap:14px; align-items:center; margin-left:6px; }
.appbar nav a{
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; text-transform:uppercase;
  letter-spacing:0.06em; text-decoration:none; color:var(--ink-dim); padding:4px 0;
  border-bottom:2px solid transparent;
}
.appbar nav a:hover{ color:var(--ink); }
.appbar nav a[aria-current="page"]{ color:var(--accent); border-bottom-color:var(--accent); }
.appbar .spacer{ margin-left:auto; }

.userchip{
  display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
  border:1px solid var(--line); border-radius:22px; padding:5px 12px 5px 6px; background:var(--bg-elev);
}
.userchip .avatar{
  width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--scope-bg);
  display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace;
  font-weight:700; font-size:0.75rem; flex:none;
}
.userchip .meta{ display:flex; flex-direction:column; line-height:1.15; }
.userchip .meta .n{ font-family:'JetBrains Mono',monospace; font-size:0.7rem; font-weight:700; }
.userchip .meta .x{ font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:var(--ink-dim); }
@media (max-width:640px){
  .appbar nav{ display:none; }
  .userchip .meta{ display:none; }
}

/* ===== Botones ===== */
.btn{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.82rem;
  letter-spacing:0.03em; text-transform:uppercase; border-radius:8px; border:1px solid var(--line);
  padding:11px 18px; cursor:pointer; background:var(--bg-elev); color:var(--ink);
  transition:transform .15s ease, border-color .15s ease; text-decoration:none; display:inline-block;
  text-align:center;
}
.btn:hover{ transform:translateY(-1px); border-color:var(--accent); }
.btn:active{ transform:translateY(0); }
.btn.primary{ background:var(--accent); color:var(--scope-bg); border-color:var(--accent); }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--bad); border-color:var(--bad); }
.btn.small{ padding:7px 12px; font-size:0.7rem; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
.btn-row{ display:flex; gap:12px; flex-wrap:wrap; }

/* ===== Formularios ===== */
.field{ display:flex; flex-direction:column; gap:6px; }
label{
  font-family:'JetBrains Mono',monospace; font-size:0.68rem; text-transform:uppercase;
  letter-spacing:0.06em; color:var(--ink-dim); display:flex; justify-content:space-between;
}
label b{ color:var(--ink); font-variant-numeric:tabular-nums; }
input[type=email], input[type=password], input[type=text], select, textarea{
  font-family:'JetBrains Mono',monospace; background:var(--bg-elev); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:0.9rem; width:100%;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
input[type=range]{ width:100%; accent-color:var(--accent); }

/* ===== Tarjetas / paneles ===== */
.card{
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow);
}
.panel{
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow);
}
.panel-head{
  display:flex; align-items:center; gap:14px; padding:16px 20px;
  border-bottom:1px solid var(--line); background:var(--bg-sunken);
}
.panel-head h2{ font-size:1.25rem; }
.panel-body{ padding:20px; }

.callout{
  background:var(--accent-2-soft); border:1px solid var(--accent-2); border-radius:8px;
  padding:12px 14px; font-size:0.92rem; margin:14px 0;
}
.callout .eyebrow{ color:var(--accent-2); }
.notice{
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px;
  padding:12px 14px; font-size:0.9rem; color:var(--ink);
}
.notice.error{ background:var(--bad-soft); border-color:var(--bad); }

/* ===== Barras de progreso ===== */
.bar-track{ height:8px; border-radius:5px; background:var(--bg-sunken); border:1px solid var(--line); overflow:hidden; }
.bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width .5s ease; }

.ring{ position:relative; flex:none; }
.ring svg{ transform:rotate(-90deg); display:block; }
.ring .ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.9rem;
}

/* ===== Estadísticas ===== */
.stat-row{ display:flex; flex-wrap:wrap; gap:10px 28px; }
.stat{ font-family:'JetBrains Mono',monospace; }
.stat .k{ display:block; font-size:0.63rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); }
.stat .v{ font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
.stat .v.good{ color:var(--good); }
.stat .v.bad{ color:var(--bad); }
.stat .v.warn{ color:var(--accent-2); }

/* ===== Tablas ===== */
.table-scroll{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:0.86rem; }
th{
  font-family:'JetBrains Mono',monospace; font-size:0.64rem; text-transform:uppercase;
  letter-spacing:0.07em; color:var(--ink-dim); text-align:left; padding:10px 12px;
  border-bottom:1px solid var(--line); white-space:nowrap; font-weight:700;
}
td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:hover{ background:var(--bg-sunken); }
td.num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

.pill{
  font-family:'JetBrains Mono',monospace; font-size:0.62rem; text-transform:uppercase;
  letter-spacing:0.06em; padding:3px 9px; border-radius:20px; white-space:nowrap;
  background:var(--bg-sunken); color:var(--ink-dim); display:inline-block;
}
.pill.on{ background:var(--accent-soft); color:var(--good); }
.pill.warn{ background:var(--accent-2-soft); color:var(--accent-2); }
.pill.off{ background:var(--bad-soft); color:var(--bad); }

/* ===== Estado de carga / vacío ===== */
.skeleton{
  background:linear-gradient(90deg, var(--bg-sunken), var(--bg-elev), var(--bg-sunken));
  background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; height:14px;
}
@keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.empty{
  padding:34px 20px; text-align:center; color:var(--ink-dim);
  font-family:'JetBrains Mono',monospace; font-size:0.8rem;
}

/* ===== Pie ===== */
footer.appfoot{
  text-align:center; padding:40px 20px; color:var(--ink-dim);
  font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.04em;
  border-top:1px solid var(--line); margin-top:60px;
}
footer.appfoot a{ color:var(--ink-dim); }

/* ===== Aviso de modo local ===== */
.localbanner{
  background:var(--accent-2-soft); border-bottom:1px solid var(--accent-2);
  font-family:'JetBrains Mono',monospace; font-size:0.7rem; text-align:center;
  padding:7px 16px; color:var(--ink);
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
}

</style>
<style>
  .portal-hero{ padding:40px 0 8px; }
  .portal-hero h1{ font-size:clamp(2.2rem,6.5vw,3.6rem); line-height:0.98; }
  .portal-hero h1 em{ font-style:normal; color:var(--accent); }
  .portal-hero .lead{ color:var(--ink-dim); font-size:1.05rem; max-width:58ch; margin-top:14px; }

  /* Sesión de hoy */
  .hoy{
    display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center;
    background:var(--bg-elev); border:1px solid var(--accent); border-radius:14px;
    padding:22px 24px; margin-top:26px; box-shadow:var(--shadow);
  }
  @media (max-width:720px){ .hoy{ grid-template-columns:1fr; text-align:left; gap:16px; } }
  .hoy .titulo{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:1.5rem; text-transform:uppercase; }
  .hoy .sub{ color:var(--ink-dim); font-size:0.94rem; margin-top:4px; }
  .hoy .acciones{ display:flex; flex-direction:column; gap:8px; min-width:190px; }

  .sesiones{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .sesion-btn{
    font-family:'JetBrains Mono',monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.05em; border:1px solid var(--line); background:var(--bg-sunken);
    color:var(--ink-dim); border-radius:20px; padding:7px 13px; cursor:pointer;
  }
  .sesion-btn[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  /* Mapa del grado */
  .curso{ margin-top:34px; }
  .curso-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  .curso-head h2{ font-size:1.35rem; }
  .curso-head .meta{ font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.07em; }
  .asignaturas{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; }
  .asig{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:11px; padding:14px 16px;
    display:flex; flex-direction:column; gap:7px; text-decoration:none; color:var(--ink);
    position:relative; min-height:118px;
  }
  .asig.abierta{ border-color:var(--accent); }
  .asig.abierta:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .asig.cerrada{ opacity:0.5; }
  .asig .sem{ font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:var(--ink-dim); letter-spacing:0.07em; text-transform:uppercase; }
  .asig h3{ font-size:0.98rem; font-family:'Literata',serif; text-transform:none; letter-spacing:0; font-weight:600; line-height:1.3; }
  .asig .foot{ margin-top:auto; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .asig .prog{ font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--accent); }
</style>
<!-- Diagnóstico de arranque: avisa en pantalla si faltan archivos en el servidor -->
<script>
(function () {
  var fallos = [];
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      var url = t.src || t.href || '';
      if (url && url.indexOf('fonts.googleapis') === -1 && fallos.indexOf(url) === -1) fallos.push(url);
    }
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.__appLista) return;
      var lista = fallos.length
        ? '<ul style="margin:8px 0 0 18px;padding:0">' + fallos.map(function (f) {
            return '<li style="margin:3px 0;font-family:ui-monospace,monospace;font-size:13px">' +
                   f.replace(location.origin, '') + '</li>';
          }).join('') + '</ul>'
        : '';
      var aviso = document.createElement('div');
      aviso.setAttribute('role', 'alert');
      aviso.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#2c1414;' +
        'color:#ffe4e4;border-top:2px solid #ff8686;padding:16px 20px;max-height:60vh;overflow:auto;' +
        'font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      aviso.innerHTML = '<b>La aplicación no ha arrancado.</b> Faltan archivos en el servidor' +
        (fallos.length ? ':' : '. Comprueba que las carpetas <b>assets/</b>, <b>temas/</b> e <b>icons/</b> ' +
         'estén subidas junto a los .html.') + lista +
        '<div style="margin-top:10px;opacity:.85">Sube la carpeta completa (con sus subcarpetas) y recarga.</div>';
      document.body.appendChild(aviso);
    }, 8000);
  });
})();
</script>

    </div>

    <div class="stat-row" style="margin-top:22px" id="resumenGlobal"></div>

  <section id="mapa"></section>

</main>

<script type="module">
/* ============ APLICACIÓN COMPLETA INCRUSTADA ============ */
/* ===== módulo: assets/js/config.js ===== */
/* ==========================================================================
   CONFIGURACIÓN — el único archivo que necesitas tocar
   ==========================================================================

   MODO LOCAL (por defecto)
   Si dejas SUPABASE_URL y SUPABASE_ANON_KEY vacíos, la aplicación funciona
   igualmente: guarda tu progreso en el propio dispositivo (localStorage).
   Perfecto para estudiar tú solo desde ya, sin registrarte en nada.

   MODO NUBE (cuando quieras cuentas de usuario)
   Rellena las dos claves con los datos de tu proyecto de Supabase y la web
   pasará automáticamente a tener registro, login, sincronización entre
   dispositivos y panel de administración. No hay que cambiar nada más.
   Las instrucciones paso a paso están en README.md.
   ========================================================================== */

const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* Correos que se convierten automáticamente en administradores al registrarse.
   Pon aquí el tuyo antes de crear tu cuenta, por ejemplo:
   export const ADMIN_EMAILS = ["yo@ejemplo.com"];                            */
const ADMIN_EMAILS = [];

/* Identidad de la aplicación */
const APP = {
  nombre: "Física UNED",
  nombreLargo: "Plataforma de estudio · Grado en Física · UNED",
  version: "1.0.0",
};

/* ¿Hay configuración de nube disponible? */
const CLOUD_ENABLED = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

const config = { SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_EMAILS, APP, CLOUD_ENABLED };

/* ===== módulo: assets/js/curriculum.js ===== */
/* ==========================================================================
   PLAN DE ESTUDIOS — Grado en Física (UNED, código 6104)
   Cada asignatura tiene estado: "abierta" | "construccion"
   Para abrir una asignatura nueva: cambia su estado y añade su "ruta".
   ========================================================================== */

const CURSOS = [
  {
    n: 1,
    nombre: "Primer curso",
    asignaturas: [
      { code: "ff1",  nombre: "Fundamentos de Física I",    sem: 1, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "am1",  nombre: "Análisis Matemático I",      sem: 1, ects: 6, tipo: "básica", estado: "abierta", ruta: "asignatura.html?code=am1" },
      { code: "alg",  nombre: "Álgebra",                    sem: 1, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "qui",  nombre: "Química",                    sem: 1, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "bio",  nombre: "Biología",                   sem: 1, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "ff2",  nombre: "Fundamentos de Física II",   sem: 2, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "am2",  nombre: "Análisis Matemático II",     sem: 2, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "mm1",  nombre: "Métodos Matemáticos I",      sem: 2, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "fc1",  nombre: "Física Computacional I",     sem: 2, ects: 6, tipo: "básica", estado: "construccion" },
      { code: "te1",  nombre: "Técnicas Experimentales I",  sem: 2, ects: 6, tipo: "básica", estado: "construccion" },
    ],
  },
  {
    n: 2,
    nombre: "Segundo curso",

/* ==========================================================================
   STORE — sesión, usuarios y progreso
   Funciona en dos modos de forma transparente:
     · MODO LOCAL  → todo se guarda en este dispositivo (localStorage)
     · MODO NUBE   → Supabase (auth + Postgres), con caché local y cola offline

const LS = {
  progress: "fu_progress_v1",
  exams: "fu_exams_v1",
  profile: "fu_local_profile_v1",
  queue: "fu_sync_queue_v1",
};

/* ---------- utilidades de almacenamiento seguro ---------- */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* modo privado */ }
}

/* ---------- niveles ---------- */
const NIVELES = [
  { min: 0,   titulo: "Aprendiz de Newton" },
  { min: 60,  titulo: "Técnico de Laboratorio" },
  { min: 150, titulo: "Analista de Trayectorias" },
  { min: 280, titulo: "Maestro de Kepler" },
  { min: 450, titulo: "Físico Certificado" },
  { min: 700, titulo: "Catedrático de Cálculo" },
];
function nivelDe(xp) {
  let i = 0;
  NIVELES.forEach((n, idx) => { if (xp >= n.min) i = idx; });
  const siguiente = NIVELES[i + 1];
  return {
    nivel: i + 1,
    titulo: NIVELES[i].titulo,
    desde: NIVELES[i].min,
    hasta: siguiente ? siguiente.min : NIVELES[i].min + 300,
    porcentaje: siguiente
      ? Math.min(100, Math.round((100 * (xp - NIVELES[i].min)) / (siguiente.min - NIVELES[i].min)))
      : 100,
  };
}

/* ---------- cliente Supabase (carga perezosa) ---------- */
let _client = null;
async function client() {
  if (!CLOUD_ENABLED) return null;
  if (_client) return _client;
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  _client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });
  return _client;
}

/* ---------- estado en memoria ---------- */
const state = {
  modo: CLOUD_ENABLED ? "nube" : "local",
  listo: false,
  user: null,       // { id, email, nombre, rol }
  answers: {},      // "subject/topic/item" → { correct, xp, at }
  exams: [],        // { subject, topic, score, total, passed, at }
};

function modo() { return state.modo; }
function usuario() { return state.user; }
function esAdmin() { return state.user?.rol === "admin"; }
function estaListo() { return state.listo; }

const listeners = new Set();
function onCambio(cb) { listeners.add(cb); return () => listeners.delete(cb); }
function emitir() { listeners.forEach((cb) => { try { cb(state); } catch (e) {} }); }

/* ---------- perfil local ---------- */
function perfilLocal() {
  let p = lsGet(LS.profile, null);
  if (!p) {
    p = { id: "local", email: null, nombre: "Estudiante", rol: "admin" };
    lsSet(LS.profile, p);
  }
  return p;
}
function renombrarLocal(nombre) {
  const p = perfilLocal();
  p.nombre = nombre;
  lsSet(LS.profile, p);
  if (state.modo === "local") { state.user = p; emitir(); }
}

/* ==========================================================================
   INICIALIZACIÓN
   ========================================================================== */
async function init() {
  state.answers = lsGet(LS.progress, {});
  state.exams = lsGet(LS.exams, []);

  if (state.modo === "local") {
    state.user = perfilLocal();
    state.listo = true;
    emitir();
    return state;
  }

  try {
    const sb = await client();
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      await cargarUsuarioNube(sb, session.user);
      await cargarProgresoNube(sb);
      await vaciarCola();
    } else {
      state.user = null;
    }
    sb.auth.onAuthStateChange(async (_evento, sesion) => {
      if (sesion?.user) {
        await cargarUsuarioNube(sb, sesion.user);
        await cargarProgresoNube(sb);
      } else {
        state.user = null;
      }
      emitir();
    });
  } catch (e) {
    console.warn("No se pudo conectar con la nube, se usa el modo local:", e.message);
    state.modo = "local";
    state.user = perfilLocal();
  }

  state.listo = true;
  emitir();
  return state;
}

async function cargarUsuarioNube(sb, authUser) {
  let { data: perfil } = await sb.from("profiles").select("*").eq("id", authUser.id).maybeSingle();

  if (!perfil) {
    const rolInicial = ADMIN_EMAILS.includes(authUser.email) ? "admin" : "student";
    const { data } = await sb.from("profiles").insert({
      id: authUser.id,
      email: authUser.email,
      display_name: authUser.user_metadata?.display_name || authUser.email.split("@")[0],
      role: rolInicial,
    }).select().maybeSingle();
    perfil = data;
  } else {
    sb.from("profiles").update({ last_seen_at: new Date().toISOString() }).eq("id", authUser.id).then(() => {});
  }

  state.user = {
    id: authUser.id,
    email: authUser.email,
    nombre: perfil?.display_name || authUser.email.split("@")[0],
    rol: perfil?.role || "student",
  };
}

async function cargarProgresoNube(sb) {
  const { data: filas } = await sb
    .from("progress")
    .select("subject_code, topic_code, item_id, correct, xp, answered_at, box, due_date, attempts, misses")
    .eq("user_id", state.user.id);
  if (filas) {
    const mapa = {};
    filas.forEach((f) => {
      mapa[`${f.subject_code}/${f.topic_code}/${f.item_id}`] = {
        correct: f.correct, xp: f.xp, at: f.answered_at,
        box: f.box ?? 0, due: f.due_date, intentos: f.attempts ?? 1, fallos: f.misses ?? 0,
      };
    });
    // La nube manda, pero conservamos lo que solo exista en local (pendiente de subir)
    state.answers = { ...state.answers, ...mapa };
    lsSet(LS.progress, state.answers);
  }
  const { data: examenes } = await sb
    .from("exam_results")
    .select("subject_code, topic_code, score, total, passed, taken_at")
    .eq("user_id", state.user.id)
    .order("taken_at", { ascending: false });
  if (examenes) {
    state.exams = examenes.map((e) => ({
      subject: e.subject_code, topic: e.topic_code, score: e.score,
      total: e.total, passed: e.passed, at: e.taken_at,
    }));
    lsSet(LS.exams, state.exams);
  }
}

/* ==========================================================================
   AUTENTICACIÓN
   ========================================================================== */
async function registrarse(email, password, nombre) {
  const sb = await client();
  if (!sb) throw new Error("La nube no está configurada todavía.");
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { display_name: nombre } },
  });
  if (error) throw new Error(traducirError(error.message));
  return data;
}

async function entrar(email, password) {
  const sb = await client();
  if (!sb) throw new Error("La nube no está configurada todavía.");
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw new Error(traducirError(error.message));
  await cargarUsuarioNube(sb, data.user);
  await cargarProgresoNube(sb);
  await vaciarCola();
  emitir();
  return data;
}

async function salir() {
  const sb = await client();
  if (sb) await sb.auth.signOut();
  state.user = null;
  emitir();
}

async function recuperarContrasena(email) {
  const sb = await client();
  if (!sb) throw new Error("La nube no está configurada todavía.");
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/login.html",
  });
  if (error) throw new Error(traducirError(error.message));
}

function traducirError(msg) {
  const m = (msg || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (m.includes("already registered")) return "Ese correo ya tiene cuenta. Prueba a entrar.";
  if (m.includes("password should be")) return "La contraseña debe tener al menos 6 caracteres.";
  if (m.includes("email not confirmed")) return "Tienes que confirmar el correo antes de entrar.";
  if (m.includes("rate limit")) return "Demasiados intentos seguidos. Espera un minuto.";
  return msg;
}

/* ==========================================================================
   PROGRESO
   ========================================================================== */
function clave(subject, topic, item) { return `${subject}/${topic}/${item}`; }

function respuestaDe(subject, topic, item) {
  return state.answers[clave(subject, topic, item)] || null;
}

function respuestasDeTema(subject, topic) {
  const prefijo = `${subject}/${topic}/`;
  const res = {};
  Object.entries(state.answers).forEach(([k, v]) => {
    if (k.startsWith(prefijo)) res[k.slice(prefijo.length)] = v;
  });
  return res;
}

/* Repaso espaciado (sistema Leitner): días hasta el próximo repaso según caja */
const INTERVALOS = [1, 1, 3, 7, 16, 35];
function proximaFecha(caja) {
  const dias = INTERVALOS[Math.min(caja, INTERVALOS.length - 1)];
  const d = new Date();
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}

async function registrarRespuesta({ subject, topic, item, correct, xp = 0, esRepaso = false }) {
  const k = clave(subject, topic, item);
  const previa = state.answers[k];

  // El XP solo se concede la primera vez que se acierta; los repasos no puntúan de nuevo,
  // pero sí actualizan la caja de repaso espaciado.
  const yaPuntuada = Boolean(previa?.correct);
  const cajaPrevia = previa?.box ?? 0;
  const caja = correct ? Math.min(cajaPrevia + 1, INTERVALOS.length - 1) : Math.max(cajaPrevia - 1, 0);

  const registro = {
    correct,
    xp: yaPuntuada ? (previa.xp || 0) : (correct ? xp : 0),
    at: previa?.at || new Date().toISOString(),
    ultimo: new Date().toISOString(),
    box: caja,
    due: proximaFecha(caja),
    intentos: (previa?.intentos || 0) + 1,
    fallos: (previa?.fallos || 0) + (correct ? 0 : 1),
  };
  // Una pregunta ya superada nunca "se desaprende": el progreso no retrocede.
  if (yaPuntuada) registro.correct = true;

  state.answers[k] = registro;
  lsSet(LS.progress, state.answers);
  emitir();

  if (state.modo === "nube" && state.user) {
    const fila = {
      user_id: state.user.id, subject_code: subject, topic_code: topic,
      item_id: item, correct: registro.correct, xp: registro.xp,
      answered_at: registro.at, box: registro.box, due_date: registro.due,
      attempts: registro.intentos, misses: registro.fallos,
    };
    try {
      const sb = await client();
      const { error } = await sb.from("progress").upsert(fila, {
        onConflict: "user_id,subject_code,topic_code,item_id",
      });
      if (error) encolar("progress", fila);
    } catch (e) {
      encolar("progress", fila);
    }
  }
  return registro;
}

async function registrarExamen({ subject, topic, score, total, passed }) {
  const registro = { subject, topic, score, total, passed, at: new Date().toISOString() };
  state.exams.unshift(registro);
  lsSet(LS.exams, state.exams);
  emitir();

  if (state.modo === "nube" && state.user) {
    const fila = {
      user_id: state.user.id, subject_code: subject, topic_code: topic,
      score, total, passed, taken_at: registro.at,
    };
    try {
      const sb = await client();
      const { error } = await sb.from("exam_results").insert(fila);
      if (error) encolar("exam_results", fila);
    } catch (e) {
      encolar("exam_results", fila);
    }
  }
  return registro;
}

function examenes() { return state.exams; }

/* ---------- cola de sincronización offline ---------- */
function encolar(tabla, fila) {
  const cola = lsGet(LS.queue, []);
  cola.push({ tabla, fila });
  lsSet(LS.queue, cola);
}
async function vaciarCola() {
  if (state.modo !== "nube" || !state.user) return;
  const cola = lsGet(LS.queue, []);
  if (!cola.length) return;
  const sb = await client();
  const restantes = [];
  for (const item of cola) {
    try {
      const fila = { ...item.fila, user_id: state.user.id };
      const { error } = item.tabla === "progress"
        ? await sb.from("progress").upsert(fila, { onConflict: "user_id,subject_code,topic_code,item_id" })
        : await sb.from("exam_results").insert(fila);
      if (error) restantes.push(item);
    } catch (e) { restantes.push(item); }
  }
  lsSet(LS.queue, restantes);
}
window.addEventListener("online", () => { vaciarCola(); });

/* ==========================================================================
   ESTADÍSTICAS DEL USUARIO
   ========================================================================== */
function xpTotal() {
  return Object.values(state.answers).reduce((a, r) => a + (r.xp || 0), 0);
}
function aciertos() {
  const vals = Object.values(state.answers);
  return { correctas: vals.filter((v) => v.correct).length, total: vals.length };
}
function progresoTema(subject, topic, totalPreguntas) {
  const r = respuestasDeTema(subject, topic);
  const correctas = Object.values(r).filter((v) => v.correct).length;
  return {
    correctas,
    total: totalPreguntas,
    porcentaje: totalPreguntas ? Math.round((100 * correctas) / totalPreguntas) : 0,
    completado: totalPreguntas > 0 && correctas >= totalPreguntas,
  };
}
function temasConActividad() {
  const s = new Set();
  Object.keys(state.answers).forEach((k) => {
    const [subject, topic] = k.split("/");
    s.add(`${subject}/${topic}`);
  });
  return [...s];
}
function actividadPorDia(dias = 30) {
  const hoy = new Date();
  const mapa = {};
  for (let i = dias - 1; i >= 0; i--) {
    const d = new Date(hoy); d.setDate(hoy.getDate() - i);
    mapa[d.toISOString().slice(0, 10)] = 0;
  }
  Object.values(state.answers).forEach((r) => {
    const dia = (r.at || "").slice(0, 10);
    if (dia in mapa) mapa[dia] += 1;
  });
  return mapa;
}
function diasActivos() {
  return new Set(Object.values(state.answers).map((r) => (r.at || "").slice(0, 10))).size;
}
function mejorRacha() {
  const dias = [...new Set(Object.values(state.answers).map((r) => (r.at || "").slice(0, 10)))]
    .filter(Boolean).sort();
  let mejor = 0, actual = 0, previo = null;
  dias.forEach((d) => {
    if (previo) {
      const dif = (new Date(d) - new Date(previo)) / 86400000;
      actual = dif === 1 ? actual + 1 : 1;
    } else actual = 1;
    mejor = Math.max(mejor, actual);
    previo = d;
  });
  return mejor;
}
function rachaDias() {
  const dias = new Set(Object.values(state.answers).map((r) => (r.at || "").slice(0, 10)));
  let racha = 0;
  const d = new Date();
  // permite que hoy aún no haya actividad sin romper la racha de ayer
  if (!dias.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (dias.has(d.toISOString().slice(0, 10))) { racha++; d.setDate(d.getDate() - 1); }
  return racha;
}

/* ==========================================================================
   REPASO ESPACIADO — qué toca repasar hoy
   Nada caduca ni se pierde: si pasan semanas, la cola simplemente espera.
   ========================================================================== */
function pendientesDeRepaso(limite = 999) {
  const hoy = new Date().toISOString().slice(0, 10);
  return Object.entries(state.answers)
    .filter(([, v]) => v.due && v.due <= hoy)
    .map(([k, v]) => {
      const [subject, topic, item] = k.split("/");
      return { clave: k, subject, topic, item, ...v };
    })
    .sort((a, b) => (a.box - b.box) || (a.due < b.due ? -1 : 1))
    .slice(0, limite);
}

function resumenRepaso() {
  const pend = pendientesDeRepaso();
  const total = Object.keys(state.answers).length;
  const dominadas = Object.values(state.answers).filter((v) => (v.box ?? 0) >= 4).length;
  const flojas = Object.values(state.answers).filter((v) => (v.box ?? 0) <= 1 && v.intentos).length;
  return { pendientes: pend.length, total, dominadas, flojas };
}

async function adminUsuarios() {
  if (state.modo === "local") {
    const resumen = aciertos();
    return [{
      id: "local", email: "(modo local)", display_name: state.user?.nombre || "Estudiante",
      role: "admin", created_at: null, last_seen_at: new Date().toISOString(),
      xp: xpTotal(), respuestas: resumen.total, correctas: resumen.correctas,
    }];
  }
  const sb = await client();
  const { data: perfiles, error } = await sb
    .from("profiles").select("*").order("created_at", { ascending: false });
  if (error) throw new Error(error.message);

  const { data: progreso } = await sb.from("progress").select("user_id, xp, correct");
  const agregado = {};
  (progreso || []).forEach((p) => {
    const a = (agregado[p.user_id] ||= { xp: 0, respuestas: 0, correctas: 0 });
    a.xp += p.xp || 0; a.respuestas += 1; if (p.correct) a.correctas += 1;
  });

  return (perfiles || []).map((p) => ({
    ...p,
    xp: agregado[p.id]?.xp || 0,
    respuestas: agregado[p.id]?.respuestas || 0,
    correctas: agregado[p.id]?.correctas || 0,
  }));
}

async function adminPreguntasDificiles() {
  if (state.modo === "local") {
    return Object.entries(state.answers)
      .filter(([, v]) => !v.correct)
      .map(([k]) => ({ item: k, fallos: 1, intentos: 1 }));
  }
  const sb = await client();
  const { data } = await sb.from("progress").select("subject_code, topic_code, item_id, correct");
  const mapa = {};
  (data || []).forEach((r) => {
    const k = `${r.subject_code}/${r.topic_code}/${r.item_id}`;

function el(tag, props = {}, ...hijos) {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  });
  hijos.flat().forEach((h) => {
    if (h === null || h === undefined || h === false) return;
    n.appendChild(typeof h === "string" ? document.createTextNode(h) : h);
  });
  return n;
}

/* Anillo de progreso reutilizable */
function anillo(porcentaje, tamano = 74, etiqueta = null) {
  const radio = tamano / 2 - 6;
  const circ = 2 * Math.PI * radio;
  const offset = circ * (1 - Math.max(0, Math.min(100, porcentaje)) / 100);
  const cont = el("div", { class: "ring", style: `width:${tamano}px;height:${tamano}px` });
  cont.innerHTML = `
    <svg width="${tamano}" height="${tamano}" viewBox="0 0 ${tamano} ${tamano}" aria-hidden="true">
      <circle cx="${tamano / 2}" cy="${tamano / 2}" r="${radio}" fill="none" stroke="var(--bg-sunken)" stroke-width="7"/>
      <circle cx="${tamano / 2}" cy="${tamano / 2}" r="${radio}" fill="none" stroke="var(--accent)" stroke-width="7"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label">${etiqueta ?? porcentaje + "%"}</div>`;
  return cont;
}

/* Formato de fechas en español, tolerante a nulos */
function fecha(iso, conHora = false) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const opciones = conHora
    ? { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }
    : { day: "2-digit", month: "short", year: "numeric" };
  return d.toLocaleDateString("es-ES", opciones);
}
function haceCuanto(iso) {
  if (!iso) return "nunca";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(min)) return "nunca";
  if (min < 1) return "ahora mismo";
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  if (d < 30) return `hace ${d} d`;
  return fecha(iso);
}

/* Registro del service worker (PWA) */
function registrarPWA() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return; // no funciona abriendo el archivo directamente
  const r = raiz();
  navigator.serviceWorker.register(r + "sw.js").catch(() => {});
}

/* ==========================================================================
   MOTOR DE PREGUNTAS
   Se usa en los temas (mini-test por estación), en el examen de certificación
   y en la sesión de repaso espaciado.
   Filosofía: fallar no castiga. Una pregunta fallada vuelve pronto; una
   acertada se aleja en el tiempo. El progreso nunca retrocede.
   ========================================================================== */


function renderQuiz(contenedor, opciones) {
  const {
    subject, topic, preguntas,
    examen = false,
    xpPorPregunta = 10,
    aprobadoMin = 0.75,
    esRepaso = false,
    onFin = null,
  } = opciones;

  contenedor.innerHTML = "";
  let respondidasSesion = 0;
  let aciertosSesion = 0;

  preguntas.forEach((item, i) => {
    const idItem = item.id || `q${i}`;
    const previa = store.respuestaDe(subject, topic, idItem);
    const yaAcertada = Boolean(previa?.correct) && !esRepaso;

    const bloque = el("div", { class: "quiz-item" });

    const textoPregunta = el("span", { html: item.q });
    const enunciado = el("div", { class: "q" },
      el("span", { class: "idx" }, `P${i + 1}.`),
      textoPregunta
    );
    bloque.appendChild(enunciado);

    const opts = el("div", { class: "opts" });
    const explicacion = el("div", { class: "explain" },
      el("span", { html: item.explica || "" })
    );

    item.opts.forEach((texto, oi) => {
      const boton = el("button", { class: "opt", type: "button", html: texto });

      if (yaAcertada) {
        boton.disabled = true;
        if (oi === item.correcta) boton.classList.add("correct");
      }

      boton.addEventListener("click", async () => {
        opts.querySelectorAll(".opt").forEach((b) => (b.disabled = true));
        const acierto = oi === item.correcta;
        respondidasSesion++;
        if (acierto) aciertosSesion++;

        if (acierto) {
          boton.classList.add("correct");
        } else {
          boton.classList.add("wrong");
          opts.querySelectorAll(".opt")[item.correcta].classList.add("correct");
        }

        const antes = store.xpTotal();
        await store.registrarRespuesta({
          subject, topic, item: idItem, correct: acierto, xp: xpPorPregunta, esRepaso,
        });
        const ganado = store.xpTotal() - antes;

        if (ganado > 0) {
          textoPregunta.appendChild(el("span", { class: "xp-pop" }, `+${ganado} XP`));
        }

        const nota = el("div", { class: "review-note" },
          acierto
            ? "✓ Guardado. Volverá a aparecer más adelante para consolidarlo."
            : "Sin problema: esta pregunta vuelve en un par de días. Así se aprende."
        );
        explicacion.appendChild(nota);
        explicacion.classList.add("show");

        if (onFin && respondidasSesion === preguntas.length) {
          onFin({ aciertos: aciertosSesion, total: preguntas.length });
        }
        if (examen && respondidasSesion === preguntas.length) {
          await cerrarExamen(contenedor, {
            subject, topic, aciertos: aciertosSesion, total: preguntas.length, aprobadoMin,
          });
        }
      });

      opts.appendChild(boton);
    });

    bloque.appendChild(opts);
    bloque.appendChild(explicacion);
    if (yaAcertada) {
      explicacion.classList.add("show");
      explicacion.appendChild(el("div", { class: "review-note" }, "✓ Ya superada. Aparecerá en los repasos."));
    }
    contenedor.appendChild(bloque);
  });
}

async function cerrarExamen(contenedor, { subject, topic, aciertos, total, aprobadoMin }) {
  const aprobado = aciertos / total >= aprobadoMin;
  await store.registrarExamen({ subject, topic, score: aciertos, total, passed: aprobado });

  const panel = el("div", { class: `exam-result ${aprobado ? "ok" : "again"}` },
    el("div", { class: "exam-ring" }, aprobado ? "🏆" : "↻"),
    el("h3", {}, aprobado ? "Certificado" : "Casi"),
    el("p", {},
      aprobado
        ? `${aciertos} de ${total} correctas. Tema dominado — queda registrado en tu historial de exámenes.`
        : `${aciertos} de ${total} correctas. No pasa nada: las que fallaste entran en la cola de repaso y podrás volver a intentarlo cuando quieras.`
    )
  );
  contenedor.appendChild(panel);
  panel.scrollIntoView({ behavior: "smooth", block: "center" });
}

function progresoDeTema(subject, topic, todasLasPreguntas) {

/* ===== módulo: assets/js/banco.js ===== */
/* ==========================================================================
   REGISTRO DE BANCOS DE PREGUNTAS
   Cada tema publicado registra aquí su módulo. La sesión de repaso lo usa
   para recuperar el enunciado de cualquier pregunta pendiente.
   Para añadir un tema nuevo: crea assets/js/banco/<asignatura>-<tema>.js
   y añade una línea a REGISTRO.
   ========================================================================== */

const REGISTRO = {
  "am1/preliminares": async () => bancoAm1Preliminares,
};

const cache = new Map();

async function cargarBanco(subject, topic) {
  const clave = `${subject}/${topic}`;
  if (cache.has(clave)) return cache.get(clave);
  const cargador = REGISTRO[clave];
  if (!cargador) return null;
  const modulo = await cargador();
  cache.set(clave, modulo);
  return modulo;
}

async function buscarPregunta(subject, topic, itemId) {
  const banco = await cargarBanco(subject, topic);
  if (!banco) return null;
  return banco.TODAS.find((p) => p.id === itemId) || null;
}

/* Devuelve las preguntas completas correspondientes a una lista de pendientes
   del repaso espaciado, descartando las que ya no existan en el banco. */
async function hidratarPendientes(pendientes) {
  const resultado = [];
  for (const p of pendientes) {
    const pregunta = await buscarPregunta(p.subject, p.topic, p.item);
    if (pregunta) resultado.push({ ...p, pregunta });
  }
  return resultado;
}

async function metaDeTema(subject, topic) {
  const banco = await cargarBanco(subject, topic);
  return banco?.META || null;
}

const banco = { cargarBanco, buscarPregunta, hidratarPendientes, metaDeTema, REGISTRO };

/* ---------- sesión de hoy ---------- */
function siguienteTema(){
  for (const [code, asig] of Object.entries(TEMARIOS)){
    for (const tema of asig.temas){
      if (tema.estado !== "publicado") continue;
      const preguntas = tema.preguntas || 24; // estimación por tema
      const p = store.progresoTema(code, tema.code, preguntas);
      if (!p.completado) return { subjectCode: code, asig, tema, progreso: p };
    }
  }
  return null;
}

function pintarHoy(){
  const rep = store.resumenRepaso();
  const siguiente = siguienteTema();
  const titulo = document.getElementById("hoyTitulo");
  const sub = document.getElementById("hoySub");
  const acciones = document.getElementById("hoyAcciones");
  const anillo = document.getElementById("hoyAnillo");
  acciones.innerHTML = ""; anillo.innerHTML = "";

  const pref = store.sesionPreferida();
  const sesion = store.SESIONES.find(s=>s.id===pref) || store.SESIONES[1];

  if (rep.pendientes > 0){
    titulo.textContent = `Repaso: ${rep.pendientes} pregunta${rep.pendientes===1?"":"s"} esperando`;
    const minutos = Math.max(1, Math.min(rep.pendientes, sesion.preguntas));
    sub.textContent = `Empieza por aquí — son las que tu memoria está a punto de soltar. ${minutos === 1 ? "Es un minuto" : "Son unos " + minutos + " minutos"} y listo.`;
    anillo.appendChild(ui.anillo(Math.min(100, Math.round(100*rep.dominadas/Math.max(1,rep.total))), 76, `${rep.pendientes}`));
    acciones.appendChild(ui.el("a",{class:"btn primary", href:"repaso.html"},"Repasar ahora"));
    if (siguiente) acciones.appendChild(ui.el("a",{class:"btn ghost small", href:siguiente.tema.ruta},"Seguir con el tema"));
  } else if (siguiente){
    titulo.textContent = siguiente.tema.titulo;
    sub.textContent = `${siguiente.asig.nombre} · ${siguiente.progreso.correctas > 0 ? "continúa donde lo dejaste" : "tema nuevo"} — ${siguiente.tema.gancho}.`;
    anillo.appendChild(ui.anillo(siguiente.progreso.porcentaje, 76));
    acciones.appendChild(ui.el("a",{class:"btn primary", href:siguiente.tema.ruta}, siguiente.progreso.correctas>0 ? "Continuar" : "Empezar"));
  } else {
    titulo.textContent = "Todo al día";
    sub.textContent = "No hay repasos pendientes y has completado el material publicado. El siguiente tema llega pronto.";
    anillo.appendChild(ui.anillo(100, 76, "✓"));
    acciones.appendChild(ui.el("a",{class:"btn ghost", href:"perfil.html"},"Ver mi progreso"));
  }

  const cont = document.getElementById("sesiones");
  cont.innerHTML = "";
  store.SESIONES.forEach(s=>{
    const b = ui.el("button",{class:"sesion-btn", type:"button", "aria-pressed": String(s.id===pref)},
      `${s.min} min · ${s.etiqueta.replace("Sesión ","")}`);
    b.addEventListener("click", ()=>{ store.guardarSesionPreferida(s.id); pintarHoy(); });
    cont.appendChild(b);
  });
}
