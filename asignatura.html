<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asignatura · Física UNED</title>
<meta name="theme-color" content="#0a1210">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .asig-hero{ padding:38px 0 6px; }
  .asig-hero h1{ font-size:clamp(2rem,6vw,3.2rem); line-height:1; }
  .asig-hero h1 em{ font-style:normal; color:var(--accent); }
  .asig-hero .lead{ color:var(--ink-dim); max-width:58ch; margin-top:14px; font-size:1.03rem; }
  .cabecera-progreso{
    display:flex; align-items:center; gap:22px; background:var(--bg-elev); border:1px solid var(--line);
    border-radius:14px; padding:18px 22px; margin-top:24px; box-shadow:var(--shadow); flex-wrap:wrap;
  }
  .temas{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:13px; margin-top:26px; }
  .tema{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    display:flex; flex-direction:column; gap:8px; text-decoration:none; color:var(--ink); min-height:150px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .tema.publicado{ border-color:var(--accent); }
  .tema.publicado:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .tema.pendiente{ opacity:0.52; }
  .tema .num{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:1.5rem; color:var(--accent); }
  .tema.pendiente .num{ color:var(--ink-dim); }
  .tema h3{ font-size:1rem; font-family:'Literata',serif; text-transform:none; letter-spacing:0; font-weight:600; line-height:1.3; }
  .tema .gancho{ font-family:'JetBrains Mono',monospace; font-size:0.63rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent-2); line-height:1.5; }
  .tema .foot{ margin-top:auto; display:flex; align-items:center; gap:10px; }
  .tema .bar-track{ flex:1; }
  .recursos{ display:flex; gap:13px; margin-top:14px; flex-wrap:wrap; }
  .recurso{
    background:var(--bg-sunken); border:1px solid var(--line); border-radius:10px; padding:13px 16px;
    flex:1; min-width:220px; font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--ink-dim);
  }
  .recurso b{ color:var(--ink); display:block; margin-bottom:3px; font-family:'Literata',serif; font-size:0.95rem; }
</style>
<!-- Diagnóstico de arranque: avisa en pantalla si faltan archivos en el servidor -->
<script>
(function () {
  var fallos = [];
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      var url = t.src || t.href || '';
      if (url && url.indexOf('fonts.googleapis') === -1 && fallos.indexOf(url) === -1) fallos.push(url);
    }
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.__appLista) return;
      var lista = fallos.length
        ? '<ul style="margin:8px 0 0 18px;padding:0">' + fallos.map(function (f) {
            return '<li style="margin:3px 0;font-family:ui-monospace,monospace;font-size:13px">' +
                   f.replace(location.origin, '') + '</li>';
          }).join('') + '</ul>'
        : '';
      var aviso = document.createElement('div');
      aviso.setAttribute('role', 'alert');
      aviso.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#2c1414;' +
        'color:#ffe4e4;border-top:2px solid #ff8686;padding:16px 20px;max-height:60vh;overflow:auto;' +
        'font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
      aviso.innerHTML = '<b>La aplicación no ha arrancado.</b> Faltan archivos en el servidor' +
        (fallos.length ? ':' : '. Comprueba que las carpetas <b>assets/</b>, <b>temas/</b> e <b>icons/</b> ' +
         'estén subidas junto a los .html.') + lista +
        '<div style="margin-top:10px;opacity:.85">Sube la carpeta completa (con sus subcarpetas) y recarga.</div>';
      document.body.appendChild(aviso);
    }, 8000);
  });
})();
</script>
</head>
<body>

<main class="wrap">
  <div id="contenido"></div>
</main>

<script type="module">
import * as store from "./assets/js/store.js";
import * as ui from "./assets/js/ui.js";
import { TEMARIOS, ASIGNATURAS } from "./assets/js/curriculum.js";

await ui.arrancar("asignatura");

const params = new URLSearchParams(location.search);
const code = params.get("code") || "am1";
const temario = TEMARIOS[code];
const asignatura = ASIGNATURAS[code];
const contenido = document.getElementById("contenido");

if (!temario) {
  contenido.appendChild(ui.el("div", { class: "card", style: "margin-top:40px" },
    ui.el("h2", {}, "Asignatura en construcción"),
    ui.el("p", { class: "muted", style:"margin-top:10px" },
      `${asignatura?.nombre || "Esta asignatura"} todavía no tiene temas publicados. Análisis Matemático I sí está abierta.`),
    ui.el("a", { class: "btn primary", href: "asignatura.html?code=am1" }, "Ir a Cálculo I")
  ));
} else {
  document.title = `${temario.nombre} · Física UNED`;
  pintar();
  store.onCambio(pintar);
}

function pintar(){
  contenido.innerHTML = "";

  const publicados = temario.temas.filter(t=>t.estado==="publicado");
  const completados = publicados.filter(t=>{
    const p = store.progresoTema(code, t.code, t.preguntas || 24);
    return p.completado;
  }).length;
  const pct = temario.temas.length ? Math.round(100*publicados.length/temario.temas.length) : 0;

  const hero = ui.el("section",{class:"asig-hero"},
    ui.el("span",{class:"eyebrow"}, `${asignatura?.nombre || temario.nombre} · Curso ${asignatura?.curso ?? 1} · ${asignatura?.ects ?? 6} ECTS`),
    ui.el("h1",{html: temario.apodo.replace("Cálculo", "<em>Cálculo</em>")}),
    ui.el("p",{class:"lead"}, temario.descripcion)
  );

  const cab = ui.el("div",{class:"cabecera-progreso"});
  cab.appendChild(ui.anillo(pct, 78, `${publicados.length}/${temario.temas.length}`));
  [
    { k:"Temas publicados", v:`${publicados.length} de ${temario.temas.length}` },
    { k:"Temas dominados", v:String(completados), clase:"good" },
    { k:"Repasos pendientes", v:String(store.resumenRepaso().pendientes), clase:"warn" },
  ].forEach(d=>{
    cab.appendChild(ui.el("div",{class:"stat"},
      ui.el("span",{class:"k"}, d.k), ui.el("span",{class:"v "+(d.clase||"")}, d.v)));
  });
  const rep = store.resumenRepaso();
  if (rep.pendientes > 0){
    cab.appendChild(ui.el("a",{class:"btn small primary", href:"repaso.html", style:"margin-left:auto"}, "Repasar hoy"));
  }
  hero.appendChild(cab);
  contenido.appendChild(hero);

  const grid = ui.el("div",{class:"temas"});
  temario.temas.forEach(t=>{
    const pub = t.estado === "publicado";
    const p = store.progresoTema(code, t.code, t.preguntas || 24);
    const nodo = ui.el(pub ? "a" : "div",
      Object.assign({class:`tema ${pub?"publicado":"pendiente"}`}, pub ? {href:t.ruta} : {}),
      ui.el("span",{class:"num"}, String(t.n).padStart(2,"0")),
      ui.el("h3",{}, t.titulo),
      ui.el("span",{class:"gancho"}, t.gancho),
      ui.el("div",{class:"foot"},
        pub
          ? ui.el("div",{class:"bar-track"}, ui.el("div",{class:"bar-fill", style:`width:${p.porcentaje}%`}))
          : ui.el("span",{class:"pill"}, "Próximamente"),
        pub ? ui.el("span",{class:"pill " + (p.completado ? "on" : "")}, p.completado ? "✓ Dominado" : `${p.porcentaje}%`) : null
      )
    );
    grid.appendChild(nodo);
  });
  contenido.appendChild(grid);

  if (temario.recursos?.length){
    const sec = ui.el("section",{style:"margin-top:38px"},
      ui.el("h2",{style:"font-size:1.2rem"},"Recursos de consulta"),
      ui.el("p",{class:"muted", style:"margin-top:8px; font-size:0.92rem"},
        "Material transversal del libro de la asignatura, siempre a mano.")
    );
    const fila = ui.el("div",{class:"recursos"});
    temario.recursos.forEach(r=>{
      fila.appendChild(ui.el("div",{class:"recurso"}, ui.el("b",{},r.titulo), r.nota));
    });
    sec.appendChild(fila);
    contenido.appendChild(sec);
  }
}

ui.montarPie();
</script>
</body>
</html>
